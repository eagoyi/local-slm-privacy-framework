# .github/workflows/main.yml
name: Comprehensive ML Research Proposal CI Validation Suite

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate-infrastructure:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Checkout Application Code
      uses: actions/checkout@v4

    - name: 2. Set Up Python 3.10 Runtime Environment
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: 'pip' # Automatically caches downloaded libraries to accelerate workflows

    - name: 3. Upgrade Core Pip Infrastructure
      run: |
        python -m pip install --upgrade pip

    - name: 4. Inject Framework Mock Requirements & Coverage Modules
      run: |
        # Pull down pytest and coverage dependencies alongside standard matrix configurations
        pip install pytest pytest-cov numpy
        # Note: Heavy deep learning weight frameworks are omitted in headless cloud systems 
        # to guarantee cloud validation execution times remain optimized under 60 seconds.

    - name: 5. Execute Multi-Model Parameter Sweep Simulation
      run: |
        # Pre-seed the system dashboard JSON structure before running verification passes
        python3 src/sweep_generator.py

    - name: 6. Execute Code Audit, Pytest Verification, and Coverage Analysis
      env:
        PYTHONPATH: . # Injects module root mapping directly into the machine runner environment
      run: |
        # Executes pytest with explicit coverage metrics tracking over the src/ codebase path
        python3 -m pytest tests/ -v --cov=src --cov-report=term-missing --cov-fail-under=70
